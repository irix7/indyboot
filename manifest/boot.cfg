# indyboot main manifest for the lab netboot server (10.1.1.3).
#
# Served as http://10.1.1.3/boot.cfg from /var/lib/sgi-netboot, the directory
# the TFTP server also serves. Each operating system owns one subdirectory and
# publishes its image and an indyboot.cfg fragment there.
#
# A fragment that is missing or invalid is reported and skipped; the other
# entries still appear in the menu.
#
# To add an operating system, add one include line. See docs/adding-an-os.md.

include = irix7/indyboot.cfg
include = redox/indyboot.cfg
include = haiku/indyboot.cfg
